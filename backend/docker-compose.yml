version: "3.9"
services:
  db:
    image: postgis/postgis:16-3.4   # PostgreSQL + PostGIS для гео-выдачи
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: neighbors
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine           # SMS-коды, rate-limit, WS pub/sub
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest       # S3-совместимое хранилище фото
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
  api:
    build: ./backend
    env_file: ./backend/.env
    depends_on: [db, redis, minio]
    ports: ["8000:8000"]

volumes:
  pgdata:
